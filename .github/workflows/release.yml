# Release on a v* tag: the kit's workflow (mcp-plugin-kit, go-release.yml)
# builds both binaries from the tagged commit, publishes the GitHub Release and
# then pins the plugin to it with a follow-up commit on main. Read the header of
# that workflow for the three jobs and the reasons for their order.
#
# What is this repository's own is in two hooks of the kit: scripts/release-extra.sh
# (the third-party license texts and the source of the GPL and MPL components)
# and scripts/pin-check.sh (the launcher test that guards release.json).
#
# Tags do not queue behind each other (a shared concurrency group would cancel
# the waiting ones); pins of parallel tags race for main, and the loser retries
# on the new main.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: exomind-tmi/mcp-plugin-kit/.github/workflows/go-release.yml@v0.1.0
    with:
      kit-ref: v0.1.0
      notices: false
    permissions:
      contents: write # the release and the pin commit
