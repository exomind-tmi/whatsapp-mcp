name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests (including tests/launcher: the launcher of this OS against a fake
  # release), the race detector, cross builds, rendered launchers, modes,
  # no binaries in git, the text-only plugin, shellcheck and PowerShell of the
  # launchers: the kit's. The notices are this repository's own.
  ci:
    uses: exomind-tmi/mcp-plugin-kit/.github/workflows/go-ci.yml@v0.1.0
    with:
      kit-ref: v0.1.0
      race-packages: ./internal/...
      notices: false
    permissions:
      contents: read

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: scripts/notices.sh && git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: shellcheck
        run: shellcheck scripts/*.sh
